<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>视频提取 - 无水印下载</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="视频提取">
<meta name="theme-color" content="#050505">
<meta name="format-detection" content="telephone=no">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050505;--card:rgba(255,255,255,0.06);--card-strong:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.12);--border-strong:rgba(255,255,255,0.2);
  --t1:rgba(255,255,255,0.95);--t2:rgba(255,255,255,0.55);--t3:rgba(255,255,255,0.35);
  --blue:#0a84ff;--green:#30d158;--red:#ff3b30;--orange:#ff9500;--purple:#bf5af2;
  --douyin:#fe2c55;--kuaishou:#ff7a00;--bili:#00a1d6;--xhs:#ff2442;
}
html,body{width:100%;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang SC","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding:max(env(safe-area-inset-top),12px) 16px max(env(safe-area-inset-bottom),20px);display:flex;flex-direction:column;align-items:center;min-height:100vh}

/* Ambient */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient::before{content:'';position:absolute;width:300px;height:300px;top:-100px;right:-80px;border-radius:50%;background:radial-gradient(circle,rgba(254,44,85,0.08),transparent 70%)}
.ambient::after{content:'';position:absolute;width:350px;height:350px;bottom:-100px;left:-100px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,0.06),transparent 70%)}

.container{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;flex:1}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 4px}
.header .brand{display:flex;align-items:center;gap:10px}
.header .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.header .sub{font-size:10px;color:var(--t3);margin-top:1px}
.header .status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green)}
.header .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* Input Area */
.input-area{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:14px}
.input-wrap{display:flex;gap:10px;align-items:flex-start}
.input-field{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--t1);font-family:inherit;resize:none;min-height:46px;max-height:100px;line-height:1.4;transition:border-color 0.2s}
.input-field:focus{outline:none;border-color:var(--blue)}
.input-field::placeholder{color:var(--t3)}
.extract-btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:0 20px;height:46px;font-size:15px;font-weight:600;cursor:pointer;transition:transform 0.15s,opacity 0.15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.extract-btn:active{transform:scale(0.96)}
.extract-btn:disabled{opacity:0.5;cursor:not-allowed}

/* Platform badges */
.platforms{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.plat{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border);background:rgba(255,255,255,0.03)}
.plat .ico{width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:700}
.plat-douyin .ico{background:var(--douyin)}
.plat-kuaishou .ico{background:var(--kuaishou)}
.plat-bili .ico{background:var(--bili)}
.plat-xhs .ico{background:var(--xhs)}

/* Loading */
.loading{display:none;flex-direction:column;align-items:center;gap:12px;padding:40px 20px}
.loading.show{display:flex}
.spinner{width:28px;height:28px;border:2.5px solid rgba(255,255,255,0.1);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--t2)}

/* Result */
.result{display:none;animation:fadeUp 0.4s ease}
.result.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.result-card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.result-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.result-thumb img{width:100%;height:100%;object-fit:cover}
.result-thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,0.3)}
.result-thumb .play-icon::after{content:'';width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #fff;margin-left:3px}
.result-thumb .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.result-thumb .plat-badge{position:absolute;top:8px;left:8px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;color:#fff}

.result-body{padding:14px}
.result-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-bottom:12px}
.result-meta span{display:flex;align-items:center;gap:3px}

.result-actions{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;border:none;transition:transform 0.15s;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:rgba(255,255,255,0.08);color:var(--t1);border:1px solid var(--border)}

/* Image grid */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#111}

/* Video player */
.video-player{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.video-player video{width:100%;height:100%;object-fit:contain}

/* Error */
.error{display:none;background:rgba(255,59,48,0.08);border:1px solid rgba(255,59,48,0.2);border-radius:14px;padding:16px;text-align:center}
.error.show{display:block}
.error h3{font-size:14px;font-weight:600;color:var(--red);margin-bottom:4px}
.error p{font-size:13px;color:var(--t2)}

/* History */
.history{margin-top:8px}
.history-title{font-size:12px;color:var(--t3);margin-bottom:8px;padding:0 4px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.2s}
.history-item:active{background:var(--card-strong)}
.history-thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#111;flex-shrink:0}
.history-info{flex:1;min-width:0}
.history-info .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-info .p{font-size:11px;color:var(--t3);margin-top:2px}

/* Footer */
.footer{text-align:center;padding:16px 0 8px;font-size:11px;color:var(--t3)}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="container">

  <div class="header">
    <div class="brand">
      <div class="logo">⬇</div>
      <div>
        <h1>视频提取</h1>
        <div class="sub">无水印 · 免登录 · 免费</div>
      </div>
    </div>
    <div class="status">
      <div class="dot"></div>
      <span id="srvStatus">在线</span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea class="input-field" id="linkInput" placeholder="粘贴抖音/快手/B站/小红书链接" rows="1"></textarea>
      <button class="extract-btn" id="extractBtn" onclick="doExtract()">提取</button>
    </div>
    <div class="platforms">
      <div class="plat plat-douyin"><div class="ico">D</div>抖音</div>
      <div class="plat plat-kuaishou"><div class="ico">K</div>快手</div>
      <div class="plat plat-bili"><div class="ico">B</div>B站</div>
      <div class="plat plat-xhs"><div class="ico">X</div>小红书</div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">正在解析...</div>
  </div>

  <div class="result" id="result"></div>

  <div class="error" id="error">
    <h3 id="errorTitle">提取失败</h3>
    <p id="errorMsg"></p>
  </div>

  <div class="history" id="history" style="display:none">
    <div class="history-title">最近提取</div>
    <div id="historyList"></div>
  </div>

  <div class="footer">
    粘贴链接即可自动识别平台 · 点击播放预览 · 长按下载保存
  </div>

</div>

<script>
const API = window.location.origin;
let history = [];

// Auto-resize textarea
const input = document.getElementById('linkInput');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});
input.addEventListener('paste', () => {
  setTimeout(() => { doExtract(); }, 100);
});

// Check server status
fetch(API + '/api/health').then(r => r.json()).then(d => {
  document.getElementById('srvStatus').textContent = '在线';
}).catch(() => {
  document.getElementById('srvStatus').textContent = '离线';
  document.querySelector('.dot').style.background = '#ff3b30';
});

async function doExtract() {
  const link = input.value.trim();
  if (!link) return;

  document.getElementById('loading').classList.add('show');
  document.getElementById('result').classList.remove('show');
  document.getElementById('error').classList.remove('show');
  document.getElementById('extractBtn').disabled = true;
  document.getElementById('loadingText').textContent = '正在解析...';

  try {
    const resp = await fetch(API + '/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link })
    });
    const data = await resp.json();

    document.getElementById('loading').classList.remove('show');
    document.getElementById('extractBtn').disabled = false;

    if (data.success) {
      showResult(data);
      addHistory(data);
    } else {
      showError(data.error || '提取失败');
    }
  } catch (e) {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('extractBtn').disabled = false;
    showError('网络错误: ' + e.message);
  }
}

function platColor(p) {
  if (p.includes('抖音')) return '#fe2c55';
  if (p.includes('快手')) return '#ff7a00';
  if (p.includes('哔')) return '#00a1d6';
  if (p.includes('小红书')) return '#ff2442';
  return '#0a84ff';
}

function showResult(data) {
  const result = document.getElementById('result');
  let html = '<div class="result-card">';

  if (data.type === 'video' && data.videoUrl) {
    // Video player
    const proxyUrl = API + '/api/proxy?url=' + encodeURIComponent(data.videoUrl);
    html += `<div class="result-thumb" id="thumbArea">
      <img src="${data.thumbnail ? API + '/api/proxy?url=' + encodeURIComponent(data.thumbnail) : ''}" onerror="this.style.display='none'">
      <div class="play-icon" onclick="playVideo('${proxyUrl}')"></div>
      <div class="plat-badge" style="background:${platColor(data.platform)}">${data.platform}</div>
      ${data.durationStr ? `<div class="dur">${data.durationStr}</div>` : ''}
    </div>`;
    html += `<div class="video-player" id="videoPlayer" style="display:none">
      <video controls autoplay playsinline style="width:100%;border-radius:0;background:#000"></video>
    </div>`;
  } else if (data.type === 'images' && data.images) {
    html += `<div class="result-thumb">
      <img src="${API}/api/proxy?url=${encodeURIComponent(data.images[0])}" onerror="this.style.display='none'">
      <div class="plat-badge" style="background:${platColor(data.platform)}">${data.platform}</div>
      <div class="dur">${data.images.length}张</div>
    </div>`;
  } else {
    html += `<div class="result-thumb">
      <div class="plat-badge" style="background:${platColor(data.platform)}">${data.platform}</div>
    </div>`;
  }

  html += '<div class="result-body">';
  html += `<div class="result-title">${data.title || '未知标题'}</div>`;
  html += '<div class="result-meta">';
  if (data.author) html += `<span>👤 ${data.author}</span>`;
  if (data.resolution) html += `<span>📺 ${data.resolution}</span>`;
  if (data.watermark) html += `<span>✓ ${data.watermark}</span>`;
  html += '</div>';

  // Actions
  if (data.type === 'video' && data.videoUrl) {
    html += `<div class="result-actions">
      <a class="btn btn-primary" href="${API}/api/proxy?url=${encodeURIComponent(data.videoUrl)}" download="${(data.title||'video').substring(0,30)}.mp4">下载视频</a>
      <button class="btn btn-secondary" onclick="copyUrl('${data.videoUrl}')">复制链接</button>
    </div>`;
  } else if (data.type === 'images' && data.images) {
    html += '<div class="result-actions">';
    data.images.forEach((img, i) => {
      if (i < 6) {
        html += `<a class="btn btn-secondary" style="flex:0 0 auto;padding:10px 14px" href="${API}/api/proxy?url=${encodeURIComponent(img)}" download="img_${i+1}.jpg">${i+1}</a>`;
      }
    });
    html += '</div>';
  }

  html += '</div></div>';
  result.innerHTML = html;
  result.classList.add('show');
}

function playVideo(url) {
  const player = document.getElementById('videoPlayer');
  const thumb = document.getElementById('thumbArea');
  if (player && thumb) {
    thumb.style.display = 'none';
    player.style.display = 'block';
    const video = player.querySelector('video');
    video.src = url;
    video.load();
    video.play().catch(() => {});
  }
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('error').classList.add('show');
}

function copyUrl(url) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert('链接已复制');
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('链接已复制');
  }
}

function addHistory(data) {
  history.unshift({
    title: data.title,
    platform: data.platform,
    thumbnail: data.thumbnail || (data.images && data.images[0]),
    type: data.type,
    videoUrl: data.videoUrl,
    images: data.images
  });
  if (history.length > 5) history.pop();
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) return;
  const el = document.getElementById('history');
  const list = document.getElementById('historyList');
  el.style.display = 'block';
  list.innerHTML = history.map(h => `
    <div class="history-item" onclick='showResult(${JSON.stringify(h).replace(/'/g,"&#39;")})'>
      ${h.thumbnail ? `<img class="history-thumb" src="${API}/api/proxy?url=${encodeURIComponent(h.thumbnail)}" onerror="this.style.display='none'">` : '<div class="history-thumb"></div>'}
      <div class="history-info">
        <div class="t">${h.title}</div>
        <div class="p">${h.platform}</div>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
